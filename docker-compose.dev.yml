version: "3.8"

services:
  tulipana-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tulipana-dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    environment:
      - NODE_ENV=development
